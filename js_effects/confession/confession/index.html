    <style type="text/css">
        #setup-screen {

            margin: 48px auto;
            padding: 24px;
            border: 1px solid #f0d7d7;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 28px rgba(70, 30, 30, .12);
        }

        #setup-screen h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        #setup-screen p {
            margin: 0 0 20px;
            color: #666;
            line-height: 1.6;
        }

        #setup-form label {
            display: block;
            margin: 16px 0 6px;
            font-weight: bold;
        }

        #setup-form input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font: inherit;
        }

        #setup-form button {
            width: 100%;
            margin-top: 20px;
            padding: 11px;
            border: 0;
            border-radius: 6px;
            background: #be1a25;
            color: #fff;
            font: inherit;
            cursor: pointer;
        }

        #setup-error {
            margin-top: 12px;
            color: #b42318;
        }

        @media (max-width: 520px) {
            #setup-screen {
                margin: 24px 16px;
                padding: 20px;
            }
        }

<body>
    <p><button><a href="./confession.rar">源码下载</a></button></p>
    <section id="setup-screen">
        <h1>先填写专属信息</h1>
        <p>填写后即可开始表白特效，开始时间用于显示已相伴时长。</p>
        <form id="setup-form">
            <label for="recipient-name-input">对方姓名</label>
            <input id="recipient-name-input" name="recipientName" type="text" maxlength="30" autocomplete="name" required>
            <label for="sender-name-input">你的署名（选填）</label>
            <input id="sender-name-input" name="senderName" type="text" maxlength="30" autocomplete="off">
            <label for="together-input">开始计时的日期和时间</label>
            <input id="together-input" name="together" type="datetime-local" required>
            <button type="submit">开始特效</button>
            <div id="setup-error" role="alert" aria-live="polite"></div>
        </form>
    </section>
    <audio id="background-music">
        <source src="renxi.mp3" type="audio/mp3" />

    <div id="main" style="display:none">

                href="http://firefox.com.cn/download/">Firefox</a>)浏览器，或者其他游览器的最新版本。</div>
        <div id="wrap">
            <div id="text">
                <div id="code">
                    <font color="#FF0000"> <span class="say">亲爱的<span id="greeting-name"></span>，我爱你，虽然你看不见我对你的告白</span><br>
                        <span class="say"> </span><br>
                        <span class="say"> 我知道我不会甜言蜜语，但是我会用行动证明一切</span><br>
                        <span class="say"> </span><br>



                        <span class="say">你说我啰嗦，有些东西因为越在乎所以越失去</span><br>
                        <span class="say">因为我太爱你了，所以我失去你了</span><br>
                        <span class="say">因为我太啰嗦了，所以你离开了我</span><br>

                        <span class="say">虽然你看不见我的告白，但是我还是要把这些心里话说出来</span><br>
                        <span class="say"> </span><br>
                        <span class="say"><span class="space"></span> -- 爱你的<span id="sender-name">人</span> --</span>
                    </font>
                    </p>
                </div>
            </div>

                <span class="STYLE1"></span>

            <canvas id="canvas" width="1100" height="680"></canvas>

    <script>
    </script>

    <script>
        function startEffect() {
        (function () {
            var canvas = $('#canvas');

            if (!canvas[0].getContext) {
                $("#error").show();
                return false;
            }

            var width = canvas.width();
            var height = canvas.height();
            canvas.attr("width", width);
            canvas.attr("height", height);
            var opts = {
                seed: {
                    x: width / 2 - 20,
                    color: "rgb(190, 26, 37)",
                    scale: 2
                },
                branch: [
                    [535, 680, 570, 250, 500, 200, 30, 100, [
                        [540, 500, 455, 417, 340, 400, 13, 100, [
                            [450, 435, 434, 430, 394, 395, 2, 40]
                        ]],
                        [550, 445, 600, 356, 680, 345, 12, 100, [
                            [578, 400, 648, 409, 661, 426, 3, 80]
                        ]],
                        [539, 281, 537, 248, 534, 217, 3, 40],
                        [546, 397, 413, 247, 328, 244, 9, 80, [
                            [427, 286, 383, 253, 371, 205, 2, 40],
                            [498, 345, 435, 315, 395, 330, 4, 60]
                        ]],
                        [546, 357, 608, 252, 678, 221, 6, 100, [
                            [590, 293, 646, 277, 648, 271, 2, 80]
                        ]]
                    ]]
                ],
                bloom: {
                    num: 700,
                    width: 1080,
                    height: 650,
                },
                footer: {
                    width: 1200,
                    height: 5,
                    speed: 10,
                }
            }

            var tree = new Tree(canvas[0], width, height, opts);
            var seed = tree.seed;
            var foot = tree.footer;
            var hold = 1;

            canvas.click(function (e) {
                var offset = canvas.offset(),
                    x, y;
                x = e.pageX - offset.left;
                y = e.pageY - offset.top;
                if (seed.hover(x, y)) {
                    hold = 0;
                    canvas.unbind("click");
                    canvas.unbind("mousemove");
                    canvas.removeClass('hand');
                }
            }).mousemove(function (e) {
                var offset = canvas.offset(),
                    x, y;
                x = e.pageX - offset.left;
                y = e.pageY - offset.top;
                canvas.toggleClass('hand', seed.hover(x, y));
            });

            var seedAnimate = eval(Jscex.compile("async", function () {
                seed.draw();
                while (hold) {
                    $await(Jscex.Async.sleep(10));
                }
                while (seed.canScale()) {
                    seed.scale(0.95);
                    $await(Jscex.Async.sleep(10));
                }
                while (seed.canMove()) {
                    seed.move(0, 2);
                    foot.draw();
                    $await(Jscex.Async.sleep(10));
                }
            }));

            var growAnimate = eval(Jscex.compile("async", function () {
                do {
                    tree.grow();
                    $await(Jscex.Async.sleep(10));
                } while (tree.canGrow());
            }));

            var flowAnimate = eval(Jscex.compile("async", function () {
                do {
                    tree.flower(2);
                    $await(Jscex.Async.sleep(10));
                } while (tree.canFlower());
            }));

            var moveAnimate = eval(Jscex.compile("async", function () {
                tree.snapshot("p1", 240, 0, 610, 680);
                while (tree.move("p1", 500, 0)) {
                    foot.draw();
                    $await(Jscex.Async.sleep(10));
                }
                foot.draw();
                tree.snapshot("p2", 500, 0, 610, 680);

                // 会有闪烁不得意这样做, (＞﹏＜)
                canvas.parent().css("background", "url(" + tree.toDataURL('image/png') + ")");
                canvas.css("background", "#ffe");
                $await(Jscex.Async.sleep(300));
                canvas.css("background", "none");
            }));

            var jumpAnimate = eval(Jscex.compile("async", function () {
                var ctx = tree.ctx;
                while (true) {
                    tree.ctx.clearRect(0, 0, width, height);
                    tree.jump();
                    foot.draw();
                    $await(Jscex.Async.sleep(25));
                }
            }));

            var textAnimate = eval(Jscex.compile("async", function () {
                $("#code").show().typewriter();
                $("#clock-box").fadeIn(500);
                while (true) {
                    timeElapse(window.togetherDate);
                    $await(Jscex.Async.sleep(1000));
                }
            }));

            var runAsync = eval(Jscex.compile("async", function () {
                $await(seedAnimate());
                $await(growAnimate());
                $await(flowAnimate());
                $await(moveAnimate());

                textAnimate().start();

                $await(jumpAnimate());
            }));

            runAsync().start();
        })();
        }

        document.getElementById("setup-form").addEventListener("submit", function (event) {
            event.preventDefault();

            var recipientName = document.getElementById("recipient-name-input").value.trim();
            var senderName = document.getElementById("sender-name-input").value.trim();
            var togetherDate = new Date(document.getElementById("together-input").value);
            var error = document.getElementById("setup-error");

            if (!recipientName || isNaN(togetherDate.getTime())) {
                error.textContent = "请填写对方姓名和有效的开始时间。";
                return;
            }
            if (togetherDate > new Date()) {
                error.textContent = "开始时间不能晚于当前时间。";
                return;
            }

            error.textContent = "";
            document.getElementById("greeting-name").textContent = recipientName;
            document.getElementById("clock-name").textContent = recipientName;
            document.getElementById("sender-name").textContent = senderName || "人";
            window.togetherDate = togetherDate;
            document.getElementById("setup-screen").style.display = "none";
            document.getElementById("main").style.display = "";

            var music = document.getElementById("background-music");
            var playAttempt = music.play();
            if (playAttempt && typeof playAttempt.catch === "function") {
                playAttempt.catch(function (playError) {
                    console.warn("背景音乐播放失败", playError);
                });
            }

            startEffect();
        });
    </script>
</body>
